name: 'Notify on Pull Request'
description: 'Sends notifications when a Pull Request is opened or updated'
inputs:
  slack_webhook_url:
    description: 'Slack Incoming Webhook URL'
    required: false
  discord_webhook_url:
    description: 'Discord Incoming Webhook URL'
    required: false
  telegram_bot_token:
    description: 'Telegram Bot Token'
    required: false
  telegram_chat_id:
    description: 'Telegram Chat ID (Required if using Telegram notifications)'
    required: false
  dry_run:
    description: 'Log the payload instead of actually sending it (true/false)'
    required: false
    default: 'false'
  message_prefix:
    description: 'Prefix prepended to the notification message (e.g., project name)'
    required: false

outputs:
  notification_status:
    description: 'Notification result: sent, partial, failed, dry-run, or skipped'
  failed_platforms:
    description: 'Comma-separated list of platforms that failed (empty if none)'

branding:
  icon: 'bell'
  color: 'blue'

runs:
  using: 'node20'
  main: 'dist/index.js'
