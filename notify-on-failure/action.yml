name: 'Notify on Workflow Failure'
description: 'Sends a notification when a GitHub Actions workflow fails'
inputs:
  slack_webhook_url:
    description: 'Slack Incoming Webhook URL'
    required: false
  discord_webhook_url:
    description: 'Discord Webhook URL'
    required: false
  telegram_bot_token:
    description: 'Telegram Bot Token'
    required: false
  telegram_chat_id:
    description: 'Telegram Chat ID'
    required: false
  job_name:
    description: 'Name of the failed job'
    required: false
  dry_run:
    description: 'Log the payload instead of actually sending it (true/false)'
    required: false
    default: 'false'
  message_prefix:
    description: 'Prefix prepended to the notification message (e.g., project name)'
    required: false

outputs:
  notification_status:
    description: 'Notification result: sent, partial, failed, dry-run, or skipped'
  failed_platforms:
    description: 'Comma-separated list of platforms that failed (empty if none)'

branding:
  icon: 'bell'
  color: 'blue'

runs:
  using: 'node20'
  main: 'dist/index.js'
